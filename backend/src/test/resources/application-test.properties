spring.datasource.url=jdbc:h2:mem:freshora_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

freshora.jwt.secret=test-secret-key-1234567890-1234567890
freshora.jwt.access-expiration=900000
freshora.jwt.refresh-expiration=604800000
freshora.frontend.url=http://localhost:3000
freshora.security.access-cookie-name=FRESHORA_ACCESS_TOKEN
freshora.security.refresh-cookie-name=FRESHORA_REFRESH_TOKEN
freshora.security.csrf-cookie-name=XSRF-TOKEN
freshora.security.cookie-secure=false
freshora.security.cookie-same-site=Lax
