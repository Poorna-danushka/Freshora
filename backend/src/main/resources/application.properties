spring.application.name=freshora-backend

server.port=8080
freshora.frontend.urls=${FRONTEND_URLS:${FRESHORA_FRONTEND_URL:http://localhost:5173}}
freshora.jwt.secret=${FRESHORA_JWT_SECRET}
freshora.jwt.access-expiration=${FRESHORA_JWT_ACCESS_EXPIRATION:900000}
freshora.jwt.refresh-expiration=${FRESHORA_JWT_REFRESH_EXPIRATION:604800000}
freshora.admin.email=${FRESHORA_ADMIN_EMAIL:}
freshora.admin.password=${FRESHORA_ADMIN_PASSWORD:}
freshora.security.cookie-secure=${FRESHORA_COOKIE_SECURE:false}
freshora.security.cookie-same-site=${FRESHORA_COOKIE_SAME_SITE:Lax}
freshora.storage.location=${FILE_STORAGE_LOCATION:./uploads}
freshora.upload.max-file-size=${MAX_FILE_SIZE:10MB}
freshora.frontend-url=${APP_FRONTEND_URL:${FRESHORA_FRONTEND_URL:http://localhost:5173}}
freshora.mail.from=${MAIL_FROM:}
freshora.mail.from-name=${MAIL_FROM_NAME:Freshora}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/freshora}
spring.datasource.username=${DB_USERNAME:${MYSQL_USER:}}
spring.sql.init.mode=never
spring.datasource.password=${DB_PASSWORD:${MYSQL_PASSWORD:}}

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=BINARY
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
freshora.orders.cancellable-states=${FRESHORA_ORDER_CANCELLABLE_STATES:CREATED,PAYMENT_PENDING,CONFIRMED}
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:30MB}
