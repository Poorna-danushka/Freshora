services:

  # MySQL Database
  mysql:
    image: mysql:8.4
    container_name: freshora-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - freshora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - freshora-network

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: freshora-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # JWT Configuration
      FRESHORA_JWT_SECRET: ${FRESHORA_JWT_SECRET}
      FRESHORA_JWT_ACCESS_EXPIRATION: ${FRESHORA_JWT_ACCESS_EXPIRATION:-900000}
      FRESHORA_JWT_REFRESH_EXPIRATION: ${FRESHORA_JWT_REFRESH_EXPIRATION:-604800000}

      # Admin credentials (optional, for initial setup)
      FRESHORA_ADMIN_EMAIL: ${FRESHORA_ADMIN_EMAIL}
      FRESHORA_ADMIN_PASSWORD: ${FRESHORA_ADMIN_PASSWORD}

      # CORS and Cookie settings
      FRESHORA_FRONTEND_URL: ${FRESHORA_FRONTEND_URL:-http://localhost:3000}
      FRESHORA_COOKIE_SECURE: ${FRESHORA_COOKIE_SECURE:-false}
      FRESHORA_COOKIE_SAME_SITE: ${FRESHORA_COOKIE_SAME_SITE:-Lax}

      # File storage
      FILE_STORAGE_LOCATION: ${FILE_STORAGE_LOCATION:-./uploads}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-10MB}
      MAX_REQUEST_SIZE: ${MAX_REQUEST_SIZE:-30MB}

      # Email configuration
      SPRING_MAIL_HOST: ${MAIL_HOST}
      SPRING_MAIL_PORT: ${MAIL_PORT}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: true
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: true
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Freshora}
    ports:
      - "8080:8080"
    volumes:
      - freshora_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    networks:
      - freshora-network

  # React + Vite Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: freshora-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - freshora-network

networks:
  freshora-network:
    driver: bridge

volumes:
  freshora_mysql_data:
  freshora_uploads: