spring.application.name=freshora-backend

server.port=8080
freshora.frontend.urls=${FRONTEND_URLS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176}
freshora.jwt.secret=${FRESHORA_JWT_SECRET:local-development-secret-change-before-production-1234567890}
freshora.jwt.access-expiration=${FRESHORA_JWT_ACCESS_EXPIRATION:900000}
freshora.jwt.refresh-expiration=${FRESHORA_JWT_REFRESH_EXPIRATION:604800000}
freshora.security.cookie-secure=${FRESHORA_COOKIE_SECURE:false}
freshora.security.cookie-same-site=${FRESHORA_COOKIE_SAME_SITE:Lax}

spring.datasource.url=jdbc:mysql://localhost:3306/freshora
spring.datasource.username=danushka
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
